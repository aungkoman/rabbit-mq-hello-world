version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-server
    ports:
      - "5672:5672"
      - "15672:15672"

  service-1:
    image: myapp-service-1:latest
    container_name: service-1-express
    ports:
      - "5501:5501"
    depends_on:
      - rabbitmq

  service-2:
    image: myapp-service-2:latest
    container_name: service-2-hono
    ports:
      - "5502:5502"
    depends_on:
      - rabbitmq

  service-3:
    image: myapp-service-3:latest
    container_name: service-3-express
    ports:
      - "5503:5503"
    depends_on:
      - rabbitmq

  service-4:
    image: myapp-service-4:latest
    container_name: service-4-dotnet
    ports:
      - "5504:5504"
    environment:
      # launchSettings ကို ကျော်ပြီး 5504 ကိုသာ သုံးရန်
      - ASPNETCORE_URLS=http://+:5504
      - DOTNET_USE_POLLING_FILE_WATCHER=true
    # Dockerfile ထဲက ENTRYPOINT ကို ကျော်ပြီး ဤ Command ကိုသာ Run ရန်
    command: ["dotnet", "watch", "run", "--no-launch-profile", "--urls", "http://0.0.0.0:5504"]
    depends_on:
      - rabbitmq

  # ── Service 5 – Laravel ──────────────────────────────────────────────────────

  service-5-app:
    image: myapp-service-5-app:latest
    container_name: laravel-app
    restart: unless-stopped
    expose:
      - "9000"
    working_dir: /var/www/html
    networks:
      laravel:
        aliases:
          - app
    depends_on:
      service-5-mysql:
        condition: service_healthy
      service-5-redis:
        condition: service_started

  service-5-nginx:
    image: myapp-service-5-nginx:latest
    container_name: laravel-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    networks:
      - laravel
    depends_on:
      - service-5-app

  service-5-mysql:
    image: mysql:8.0
    container_name: laravel-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      SERVICE_TAGS: prod
      SERVICE_NAME: mysql
    volumes:
      - s5_mysql_data:/var/lib/mysql
    networks:
      - laravel
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  service-5-redis:
    image: redis:alpine
    container_name: laravel-redis
    restart: unless-stopped
    volumes:
      - s5_redis_data:/data
    networks:
      - laravel
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  service-5-queue:
    image: myapp-service-5-app:latest
    container_name: laravel-queue
    restart: unless-stopped
    working_dir: /var/www/html
    networks:
      - laravel
    depends_on:
      service-5-mysql:
        condition: service_healthy
    command: php artisan queue:work database --tries=3 --timeout=90

  service-5-scheduler:
    image: myapp-service-5-app:latest
    container_name: laravel-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    networks:
      - laravel
    depends_on:
      service-5-mysql:
        condition: service_healthy
      service-5-redis:
        condition: service_started
    command: php artisan schedule:work

networks:
  laravel:
    driver: bridge

volumes:
  s5_mysql_data:
  s5_redis_data: